<!doctype html><html lang="ko"><meta charset="utf-8"><title>기사 전처리</title>
<style>body{font:16px sans-serif;max-width:1100px;margin:40px auto;color:#243047}button,select,input{padding:8px;margin:5px}article{border:1px solid #ccd5df;padding:20px;margin:16px 0;border-radius:8px}pre{white-space:pre-wrap;line-height:1.7}small{color:#566}details{margin:12px 0}</style>
<h1>기사 전처리</h1><p>정책뉴스 JSON 또는 원본 XML을 등록하고, 적합성·카테고리·사실 추출 결과를 검토하세요.</p>
<a href="/">콘텐츠 생성 화면</a><p><input id="file" type="file" accept=".json,.xml"><button id="import">파일 파싱</button><button id="run">파싱 완료 기사 전처리</button></p><p id="message" role="status"></p><main id="items"></main>
<script>
const labels={IT_SCIENCE:'IT·과학',LIFE_CULTURE:'생활·문화',POLITICS:'정치',SOCIETY:'사회',ECONOMY:'경제',WORLD:'세계'};
const statuses={parsed:'파싱 완료',parse_hold:'파싱 보류',filter_rejected:'부적합',filter_hold:'적합성 검토 필요',facts_insufficient:'사실 부족',ready:'전처리 완료',error:'처리 오류'};
let records=[];const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
async function load(){records=await api('/api/preprocessing');$('items').innerHTML=records.map((r,i)=>{const c=r.content,k=r.classification;return `<article><h2>${esc(c.title||'제목 없음')}</h2><p>${esc(c.news_id)} · ${esc(statuses[r.status]||r.status)}</p><p>${esc(r.filter?.reason||r.errors?.join(', ')||'')}</p>${r.filter?.evidence?.length?`<pre>${esc(r.filter.evidence.join('\n'))}</pre>`:''}<details><summary>원문과 메타데이터</summary><pre>${esc(c.text)}</pre><pre>${esc(JSON.stringify(r.metadata,null,2))}</pre></details>${k?`<p>1분류: ${esc(labels[k.primary.category])} ${k.primary.score}% / 2분류: ${esc(labels[k.secondary.category])} ${k.secondary.score}%</p><small>주제 적합도이며 정답 확률이 아닙니다. ${k.primary.score===k.secondary.score?'동점 후보입니다.':''}</small><p><select id="category-${i}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===k.final_category?'selected':''}>${l}</option>`).join('')}</select><button data-review="${i}">카테고리 확정</button>${k.review_status==='reviewed'?'검수 완료':'검수 대기'}</p>`:''}${r.facts?`<h3>추출 사실</h3><pre>${esc(r.facts)}</pre>`:''}</article>`}).join('');}
async function busy(action){$('import').disabled=$('run').disabled=true;$('message').textContent='처리 중…';try{await action();await load();$('message').textContent='처리 완료'}catch(e){$('message').textContent=e.message}finally{$('import').disabled=$('run').disabled=false}}
$('import').onclick=()=>busy(async()=>{const file=$('file').files[0];if(!file)throw Error('파일을 선택하세요');const text=await file.text();let articles;if(file.name.endsWith('.xml')){const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('XML 형식 오류');const code=xml.querySelector('resultCode')?.textContent;if(code&&code!=='0')throw Error('API 오류 응답입니다');articles=[...xml.getElementsByTagName('NewsItem')].map(n=>Object.fromEntries([...n.children].map(c=>[c.tagName,c.textContent])))}else{const data=JSON.parse(text);articles=Array.isArray(data)?data:data.articles}if(!Array.isArray(articles)||!articles.length)throw Error('기사 배열이 없습니다');await api('/api/preprocessing/parse','POST',{articles})});
$('run').onclick=()=>busy(async()=>{const article_ids=records.filter(r=>['parsed','error'].includes(r.status)).map(r=>r.source_article_id);if(!article_ids.length)throw Error('파싱 완료 기사가 없습니다');await api('/api/preprocessing/run','POST',{article_ids,retry_errors:true})});
$('items').onclick=e=>{const i=e.target.dataset.review;if(i!==undefined)busy(()=>api('/api/preprocessing/'+encodeURIComponent(records[i].content.news_id)+'/category','PATCH',{category:$('category-'+i).value}))};
load().catch(e=>$('message').textContent=e.message);
</script></html>
